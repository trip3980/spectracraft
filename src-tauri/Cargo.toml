[workspace]

[package]
name = "spectracraft-tauri"
version = "0.1.0"
description = "SpectraCraft cross-platform desktop and mobile shell (Tauri 2)"
edition = "2021"
rust-version = "1.89"

[lib]
name = "spectracraft_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
spectracraft-mono = { path = "../spectracraft-mono", default-features = false }
