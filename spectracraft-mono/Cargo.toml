[package]
name = "spectracraft-mono"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
default-run = "spectracraft-mono"
repository.workspace = true

[dependencies]
# Pinned Git dependencies from storytold/craft-libs (never track a floating branch).
# Upstream has no semver Git tags yet; pinned to explicit commit rev.
# When a release tag (e.g. v0.1.0) is published, switch `rev = "..."` to `tag = "v0.1.0"`.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "05b99ee5dcd64f2c954a693ef361301214ddc3c7" }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "05b99ee5dcd64f2c954a693ef361301214ddc3c7", default-features = false }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "05b99ee5dcd64f2c954a693ef361301214ddc3c7" }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "=0.41.0", optional = true }
claxon = { version = "=0.4.3", optional = true }
ebur128 = { version = "=0.1.10", optional = true }
hound = "=3.5.1"
rustfft = "=6.4.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11"], optional = true }
rfd = { version = "=0.15.4", optional = true }
rodio = { version = "=0.20.1", default-features = false, optional = true }

[features]
bench = ["dep:zip", "dep:quick-xml", "dep:claxon", "dep:ebur128"]
desktop = ["dep:eframe", "dep:rfd", "dep:rodio"]

[[bin]]
name = "spectracraft-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[dev-dependencies]
egui_kittest = { version = "=0.31.1", default-features = false }
png = "=0.18.1"

