name: Desktop CI (Linux, Windows, macOS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  desktop-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64-unknown-linux-gnu)
            os: ubuntu-latest
          - name: Windows (x86_64-pc-windows-msvc)
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89+
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Verify core engine compiles without desktop dependencies (mobile-ready boundary)
        run: cargo check --locked --lib --no-default-features

      - name: Run core library, CLI, and invariant tests
        run: cargo test --locked

      - name: Run native desktop unit tests
        run: cargo test --locked --features desktop --bin spectracraft-desktop

      - name: Build release native desktop executable
        run: cargo build --locked --release --features desktop --bin spectracraft-desktop
