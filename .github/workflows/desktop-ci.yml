name: SpectraCraft CI (Independent Platform & Verification Gates)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend-checks:
    name: Frontend TypeCheck, Unit Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx --test src/lib/*.test.ts
      - run: npm run build

  rust-core-tests:
    name: Rust Core Library, CLI & Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify mobile-ready core boundary without desktop deps
        run: cargo check --locked --lib --no-default-features
      - name: Run core library, CLI, and audio verification tests
        run: cargo test --locked
      - name: Check formatting
        run: cargo fmt --all --check

  native-desktop-check:
    name: Native egui Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
          - name: Windows (x86_64)
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev
      - name: Compile native desktop binary
        run: cargo check --locked --features desktop --bin spectracraft-desktop
      - name: Run native desktop unit tests
        run: cargo test --locked --features desktop --bin spectracraft-desktop

  tauri-check:
    name: Tauri 2 Shell Compilation & Rust IPC Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install Linux WebKitGTK / Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev
      - name: Check and test Tauri shell crate
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

  source-manifest-and-advisories:
    name: Source Integrity Manifest & Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify SOURCE-SHA256.json freshness and path semantics
        run: node scripts/verify-source-manifest.mjs
